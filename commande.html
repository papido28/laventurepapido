<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander le livre | PAPIDO</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .commande-container { max-width: 900px; margin: 40px auto; padding: 40px 30px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .hero-commande { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
        .hero-commande img { width: 100%; max-width: 380px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        label { display:block; margin:15px 0 6px; font-weight:bold; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #999; border-radius: 8px; font-size: 16px; }
        .payment-buttons { display: none; margin-top: 30px; }
        .btn-principal { width: 100%; padding: 18px; font-size: 22px; font-weight: bold; background: #c40000; color: white; border: none; border-radius: 10px; margin: 10px 0; cursor: pointer; }
        .btn-principal:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-paypal { width: 100%; padding: 16px; font-size: 20px; font-weight: bold; background: #003087; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .erreur-msg { color: #c40000; font-weight: bold; margin-top: 10px; display: none; }
        .prix-total { font-size: 42px; font-weight: bold; color: #c40000; text-align: center; margin: 5px 0 10px 0; }
        .quantite-selector { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 15px 0 25px 0; }
        .quantite-selector button { width: 40px; height: 40px; font-size: 22px; font-weight: bold; background: #f0f0f0; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; }
        .quantite-selector button:hover { background: #e0e0e0; }
        .quantite-selector input { width: 60px; text-align: center; padding: 8px; font-size: 18px; font-weight: bold; }
        .avertissement-remplissage { color: #c40000; font-size: 14px; margin: 15px 0; font-style: italic; }
    </style>
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo">PAPIDO</div>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="index.html#livre">Le Livre</a></li>
            <li><a href="index.html#videos">Vidéos</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </div>
</header>

<div class="commande-container">
    <div class="hero-commande">
        <div>
            <img src="photo livre.jpg" alt="Le livre PAPIDO">
        </div>

        <div>
            <h1>Commander le livre</h1>
            <h2>Le Tour de France à vélo</h2>
            
            <div class="prix-total" id="prixTotal">19,90 €</div>

            <div class="quantite-selector">
                <button type="button" onclick="changerQuantite(-1)">−</button>
                <input type="number" id="quantite" min="1" max="10" value="1" readonly>
                <button type="button" onclick="changerQuantite(1)">+</button>
            </div>

            <form id="orderForm">
                <label>Prénom *</label>
                <input type="text" name="prenom" id="prenom" required>

                <label>Nom *</label>
                <input type="text" name="nom" id="nom" required>

                <label>Numéro + Voie (rue, avenue...) *</label>
                <input type="text" name="numero" id="adresse" placeholder="123" style="width:20%; display:inline-block;" required>
                <input type="text" name="voie" id="adresse1" placeholder="rue de la Paix" style="width:75%; display:inline-block;" required>

                <label>Code postal *</label>
                <input type="text" name="codepostal" id="codepostal" required>

                <label>Ville *</label>
                <input type="text" name="ville" id="ville" required>

                <label>Téléphone *</label>
                <input type="tel" name="telephone" id="telephone" placeholder="06 12 34 56 78" required>

                <label>Email *</label>
                <input type="email" name="email" id="email" required>

                <p class="avertissement-remplissage">Bien remplir chaque case pour que l'offre de paiement apparaisse</p>

                <label>Dédicace personnalisée (facultatif)</label>
                <textarea name="dedicace" id="dedicace" rows="3" placeholder="Exemple : Pour Lucas..."></textarea>

                <div id="paymentButtons" class="payment-buttons">
                    <button type="button" class="btn-principal" id="btnCarte" onclick="payerCarte()">
                        💳 PAYER PAR CARTE BANCAIRE
                    </button>
                    <button type="button" class="btn-paypal" onclick="payerPaypal()">
                        🅿️ PAYER AVEC PAYPAL
                    </button>
                    <div class="erreur-msg" id="erreurMsg"></div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const form = document.getElementById('orderForm');
const paymentButtons = document.getElementById('paymentButtons');
const btnCarte = document.getElementById('btnCarte');
const erreurMsg = document.getElementById('erreurMsg');

const PRIX_UNITAIRE = 19.90;

function changerQuantite(delta) {
    const input = document.getElementById('quantite');
    let val = parseInt(input.value) + delta;
    val = Math.max(1, Math.min(10, val));
    input.value = val;
    document.getElementById('prixTotal').textContent = (val * PRIX_UNITAIRE).toFixed(2).replace('.', ',') + ' €';
}

form.addEventListener('input', () => {
    const fields = ['prenom', 'nom', 'adresse', 'adresse1', 'codepostal', 'ville', 'telephone', 'email'];
    const filled = fields.every(id => {
        const el = document.getElementById(id);
        return el && el.value.trim() !== '';
    });
    paymentButtons.style.display = filled ? 'block' : 'none';
});

function getFormData() {
    function getValue(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
    }

    return {
        prenom: getValue('prenom'),
        nom: getValue('nom'),
        numero: getValue('adresse'),
        voie: getValue('adresse1'),
        codepostal: getValue('codepostal'),
        ville: getValue('ville'),
        telephone: getValue('telephone'),
        email: getValue('email'),
        dedicace: getValue('dedicace'),
        quantite: parseInt(getValue('quantite')) || 1
    };
}

async function payerCarte() {
    erreurMsg.style.display = 'none';
    btnCarte.disabled = true;
    btnCarte.textContent = 'Chargement...';

    try {
        const response = await fetch('create-checkout-session.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(getFormData())
        });

        const data = await response.json();

        if (data.url) {
            window.location.href = data.url;
        } else {
            throw new Error(data.error || 'Erreur inconnue');
        }
    } catch (err) {
        erreurMsg.textContent = "Une erreur est survenue, merci de réessayer. (" + err.message + ")";
        erreurMsg.style.display = 'block';
        btnCarte.disabled = false;
        btnCarte.textContent = '💳 PAYER PAR CARTE BANCAIRE';
    }
}

function payerPaypal() {
    window.location.href = "https://paypal.me/laventurepapido";
}
</script>

</body>
</html>
