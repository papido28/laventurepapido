<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander le livre | PAPIDO</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .commande-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .hero-commande {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .hero-commande img {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        h1 { color: #c40000; text-align:center; }
        h2 { text-align:center; color:#333; margin-bottom:20px; }
        .prix { font-size: 48px; font-weight:bold; color:#c40000; text-align:center; margin:20px 0; }
        label { display:block; margin:15px 0 6px; font-weight:bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #999;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            background: #c40000;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 25px;
            cursor: pointer;
        }
        .total { font-size: 26px; text-align:center; margin:30px 0; color:#c40000; }

        @media (max-width: 768px) {
            .hero-commande { grid-template-columns: 1fr; text-align:center; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="navbar">
        <div class="logo">PAPIDO</div>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="index.html#livre">Le Livre</a></li>
            <li><a href="index.html#videos">Vidéos</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </div>
</header>

<div class="commande-container">
    <div class="hero-commande">
        <!-- Photo du livre -->
        <div>
            <img src="photo livre.jpg" alt="Le livre PAPIDO">
        </div>

        <!-- Formulaire -->
        <div>
            <h1>Commander le livre</h1>
            <h2>Le Tour de France à vélo</h2>
            
            <div class="prix">19,90 €</div>

            <form action="https://formspree.io/f/xpqeoyya" method="POST">
                <input type="hidden" name="_next" value="https://laventurepapido.fr/merci.html">

                <label>Prénom *</label>
                <input type="text" name="prenom" required>

                <label>Nom *</label>
                <input type="text" name="nom" required>

                <label>Adresse complète *</label>
                <input type="text" name="adresse" required>

                <label>Code postal *</label>
                <input type="text" name="codepostal" required>

                <label>Ville *</label>
                <input type="text" name="ville" required>

                <label>Téléphone</label>
                <input type="tel" name="telephone">

                <label>Email *</label>
                <input type="email" name="email" required>

                <label>Dédicace personnalisée (facultatif)</label>
                <textarea name="dedicace" rows="4" placeholder="Exemple : Pour Lucas, que cette aventure t'inspire..."></textarea>

                <div class="total">
                    Total à payer : <strong>23,00 €</strong> <small>(livre + 3,10€ port)</small>
                </div>

                <button type="submit">
                    💳 COMMANDER ET PAYER MAINTENANT
                </button>
            </form>
        </div>
    </div>

    <p style="text-align:center; margin-top:30px;">
        Ou payer directement avec PayPal : 
        <a href="https://paypal.me/laventurepapido" target="_blank" style="color:#003087;">paypal.me/laventurepapido</a>
    </p>
</div>

</body>
</html>
