<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander le livre | PAPIDO</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Style simple et sûr */
        .commande-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
        }
        h1, h2 { text-align: center; color: #c40000; }
        .prix { font-size: 45px; font-weight: bold; text-align: center; margin: 20px 0; color: #c40000; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #999;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            background: #c40000;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 25px;
            cursor: pointer;
        }
        .total { font-size: 26px; text-align: center; margin: 30px 0; }
    </style>
</head>
<body>

<div class="commande-container">
    <h1>Commander le livre</h1>
    <h2>Le Tour de France à vélo</h2>
    
    <div class="prix">19,90 € + 3,10 € de port</div>

    <form action="https://formspree.io/f/xpqeoyya" method="POST">
        <input type="hidden" name="_next" value="https://laventurepapido.fr/merci.html">

        <label>Prénom *</label>
        <input type="text" name="prenom" required>

        <label>Nom *</label>
        <input type="text" name="nom" required>

        <label>Adresse complète *</label>
        <input type="text" name="adresse" required>

        <label>Code postal *</label>
        <input type="text" name="codepostal" required>

        <label>Ville *</label>
        <input type="text" name="ville" required>

        <label>Téléphone</label>
        <input type="tel" name="telephone">

        <label>Email *</label>
        <input type="email" name="email" required>

        <label>Dédicace personnalisée (facultatif)</label>
        <textarea name="dedicace" rows="4" placeholder="Ex: Pour Sophie..."></textarea>

        <div class="total">
            <strong>Total à payer : 23,00 €</strong>
        </div>

        <button type="submit">
            💳 Commander et payer maintenant
        </button>
    </form>

    <p style="text-align:center; margin-top:25px;">
        Ou payer directement avec PayPal : 
        <a href="https://paypal.me/laventurepapido" target="_blank">paypal.me/laventurepapido</a>
    </p>
</div>

</body>
</html>
