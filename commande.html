<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander le livre | PAPIDO</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .commande-container { max-width: 900px; margin: 40px auto; padding: 40px 30px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .hero-commande { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
        .hero-commande img { width: 100%; max-width: 380px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        label { display:block; margin:15px 0 6px; font-weight:bold; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #999; border-radius: 8px; font-size: 16px; }
        .payment-buttons { display: none; margin-top: 30px; }
        .btn-principal { width: 100%; padding: 18px; font-size: 22px; font-weight: bold; background: #c40000; color: white; border: none; border-radius: 10px; margin: 10px 0; cursor: pointer; }
        .btn-paypal { width: 100%; padding: 16px; font-size: 20px; font-weight: bold; background: #003087; color: white; border: none; border-radius: 10px; cursor: pointer; }
        .total { font-size: 26px; text-align:center; margin:25px 0; color:#c40000; }
    </style>
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo">PAPIDO</div>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="index.html#livre">Le Livre</a></li>
            <li><a href="index.html#videos">Vidéos</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </div>
</header>

<div class="commande-container">
    <div class="hero-commande">
        <div>
            <img src="photo livre.jpg" alt="Le livre PAPIDO">
        </div>

        <div>
            <h1>Commander le livre</h1>
            <h2>Le Tour de France à vélo</h2>
            
            <form id="orderForm">
                <label>Nombre d'exemplaires</label>
                <select id="quantite">
                    <option value="1">1 exemplaire</option>
                    <option value="2">2 exemplaires</option>
                    <option value="3">3 exemplaires</option>
                    <option value="4">4 exemplaires</option>
                    <option value="5">5 exemplaires</option>
                </select>

                <label>Prénom *</label>
                <input type="text" id="prenom" required>

                <label>Nom *</label>
                <input type="text" id="nom" required>

                <label>Adresse complète *</label>
                <input type="text" id="adresse" required>

                <label>Code postal *</label>
                <input type="text" id="codepostal" required>

                <label>Ville *</label>
                <input type="text" id="ville" required>

                <label>Email *</label>
                <input type="email" id="email" required>

                <label>Dédicace personnalisée (facultatif)</label>
                <textarea id="dedicace" rows="3" placeholder="Exemple : Pour Lucas..."></textarea>

                <div class="total">Total à payer : <strong id="totalPrice">23,00</strong> €</div>

                <div id="paymentButtons" class="payment-buttons">
                    <button type="button" class="btn-principal" onclick="payerCarte()">
                        💳 PAYER PAR CARTE BANCAIRE
                    </button>
                    <button type="button" class="btn-paypal" onclick="payerPaypal()">
                        🅿️ PAYER AVEC PAYPAL
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const form = document.getElementById('orderForm');
const paymentButtons = document.getElementById('paymentButtons');
const quantiteSelect = document.getElementById('quantite');
const totalPrice = document.getElementById('totalPrice');

function updateTotal() {
    const qty = parseInt(quantiteSelect.value);
    const total = (qty * 23).toFixed(2);
    totalPrice.textContent = total.replace('.', ',');
}

quantiteSelect.addEventListener('change', updateTotal);
form.addEventListener('input', () => {
    const fields = ['prenom','nom','adresse','codepostal','ville','email'];
    let filled = fields.every(f => document.getElementById(f).value.trim() !== '');
    paymentButtons.style.display = filled ? 'block' : 'none';
});

updateTotal();

function payerCarte() {
    const qty = quantiteSelect.value;
    window.location.href = "https://buy.stripe.com/9B6eVc0KHcURg7caYK8g000?quantity=" + qty;
}

function payerPaypal() {
    window.location.href = "https://paypal.me/laventurepapido";
}
</script>

</body>
</html>
